name: DeployBot

# Сценарий запускается только при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stackmatch:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Checkout repository files on Server
        uses: actions/checkout@v4

      - name: Log in to Docker Hub on Server
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Deploy Docker Compose
        run: |
          # 1. Переходим в рабочую папку, куда скачался чистый код
          cd /home/def/actions-runner/stackmatch-dir/StackMatch-Bot/StackMatch-Bot
          
          # 2. Копируем мастер-файлы из защищенного хранилища прямо сюда
          cp /home/def/bot_secrets/.env .env
          cp /home/def/bot_secrets/settings.toml settings.toml
          
          # 3. Полностью сбрасываем старые зависшие контейнеры (очистка конфликтов)
          docker compose down
          
          # 4. Скачиваем свежий образ и запускаем проект
          docker compose pull
          docker compose up -d
          
          # 5. Очищаем дисковый кэш
          docker image prune -f
