name: DeployBot

# Сценарий запускается только при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория на виртуалку GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Авторизуемся в вашем Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # 3. Собираем Docker-образ и отправляем его в облако Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stackmatch:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Запустится только после успешной сборки образа
    steps:
      # 4. Подключаемся к вашему Ubuntu-серверу по SSH и выполняем команды
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 6425
          script: |
            # Переходим в папку с проектом на сервере
            cd /home/${{ secrets.SERVER_USER }}/myproject
            
            # Скачиваем обновленный образ из Docker Hub
            docker compose pull
            
            # Перезапускаем контейнеры в фоновом режиме
            docker compose up -d
            
            # Удаляем старые ненужные слои образов, чтобы не забивать диск сервера
            docker image prune -f
