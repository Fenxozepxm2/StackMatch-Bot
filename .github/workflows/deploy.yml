name: DeployBot

# Сценарий запускается только при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stackmatch:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push # Запустится только после успешной сборки образа
    steps:
      # 4. Подключаемся к вашему Ubuntu-серверу по SSH и выполняем команды
      - name: Log in to Docker Hub on Server
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Deploy Docker Compose
        run: |
          cd ~/stackmatch-dir
          docker compose pull
          docker compose up -d
          docker image prune -f

